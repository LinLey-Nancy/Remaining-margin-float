<style>:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#26303a;background:#f4f6f8}*{box-sizing:border-box}body{max-width:1800px;margin:0 auto;padding:28px}h1{font-size:27px;margin:0 0 12px}p{line-height:1.7;color:#596575;margin:0 0 16px}nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:20px 0}select{font:inherit;border:1px solid #bec9d6;border-radius:6px;padding:7px 12px;background:#fff;color:#26303a}a{color:#355d9c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}article{background:#fff;border:1px solid #dbe1e8;border-radius:12px;overflow:hidden;min-width:0}h2{font-size:19px;margin:18px 18px 12px}.compact{display:flex;justify-content:space-evenly;padding:18px 8px}.compact img{width:96px;height:96px;object-fit:contain}figure{margin:0;text-align:center}figcaption{font-size:12px;color:#697582;margin:6px 0}.compact a{display:block}figure.detail{padding:12px 4px}figure.detail img{width:100%;height:auto;display:block}footer{margin-top:24px;color:#596575;line-height:1.8;font-size:14px}.theme-instrument figcaption{color:#bac7c2}@media(max-width:1350px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){body{padding:14px}.grid{grid-template-columns:1fr}article{max-width:500px;width:100%;margin:auto}}</style>
<body><h1>四主题 · 程序真实界面</h1><p>以下图片均为实际 WPF 窗口截图，使用演示数据。经典是默认主题；三个新主题按效果图实现了各自的布局、统计分组及连续余量配色。</p>
<nav><label>数据源 <select id="provider"><option value="Codex">Codex</option><option value="Kimi">Kimi Code</option><option value="DeepSeek">DeepSeek</option></select></label><label>详情余量 <select id="quota"><option value="8">低余量 8%</option><option value="82">高余量 82%</option></select></label><a href="../low-quota/index.html">设计效果图</a><a href="../../../THEMES.md">主题接口说明</a><a href="theme-kit/README.md">AI 制作套件</a><a href="theme-kit/my-theme.json" download>可导入示例</a></nav>
<main class="grid"><article data-theme="classic" class="theme-classic"><h2>经典 · 默认</h2><div class="compact" style="background:#f2f3ee"><figure><a data-value="82" data-expanded="False" href="classic-Codex-82-False.png" target="_blank"><img src="classic-Codex-82-False.png" alt="经典 · 默认 82% 紧凑态"></a><figcaption>82% 紧凑态</figcaption></figure><figure><a data-value="8" data-expanded="False" href="classic-Codex-8-False.png" target="_blank"><img src="classic-Codex-8-False.png" alt="经典 · 默认 8% 紧凑态"></a><figcaption>8% 紧凑态</figcaption></figure></div><figure class="detail" style="background:#f2f3ee"><a data-value="dynamic" data-expanded="True" href="classic-Codex-8-True.png" target="_blank"><img src="classic-Codex-8-True.png" alt="经典 · 默认 详情态"></a><figcaption>详情布局 · 点击查看原图</figcaption></figure></article><article data-theme="native" class="theme-native"><h2>浅色原生</h2><div class="compact" style="background:#e8edf2"><figure><a data-value="82" data-expanded="False" href="native-Codex-82-False.png" target="_blank"><img src="native-Codex-82-False.png" alt="浅色原生 82% 紧凑态"></a><figcaption>82% 紧凑态</figcaption></figure><figure><a data-value="8" data-expanded="False" href="native-Codex-8-False.png" target="_blank"><img src="native-Codex-8-False.png" alt="浅色原生 8% 紧凑态"></a><figcaption>8% 紧凑态</figcaption></figure></div><figure class="detail" style="background:#e8edf2"><a data-value="dynamic" data-expanded="True" href="native-Codex-8-True.png" target="_blank"><img src="native-Codex-8-True.png" alt="浅色原生 详情态"></a><figcaption>详情布局 · 点击查看原图</figcaption></figure></article><article data-theme="instrument" class="theme-instrument"><h2>深色仪表</h2><div class="compact" style="background:#14191c"><figure><a data-value="82" data-expanded="False" href="instrument-Codex-82-False.png" target="_blank"><img src="instrument-Codex-82-False.png" alt="深色仪表 82% 紧凑态"></a><figcaption>82% 紧凑态</figcaption></figure><figure><a data-value="8" data-expanded="False" href="instrument-Codex-8-False.png" target="_blank"><img src="instrument-Codex-8-False.png" alt="深色仪表 8% 紧凑态"></a><figcaption>8% 紧凑态</figcaption></figure></div><figure class="detail" style="background:#14191c"><a data-value="dynamic" data-expanded="True" href="instrument-Codex-8-True.png" target="_blank"><img src="instrument-Codex-8-True.png" alt="深色仪表 详情态"></a><figcaption>详情布局 · 点击查看原图</figcaption></figure></article><article data-theme="paper" class="theme-paper"><h2>柔和纸感</h2><div class="compact" style="background:#e7e5de"><figure><a data-value="82" data-expanded="False" href="paper-Codex-82-False.png" target="_blank"><img src="paper-Codex-82-False.png" alt="柔和纸感 82% 紧凑态"></a><figcaption>82% 紧凑态</figcaption></figure><figure><a data-value="8" data-expanded="False" href="paper-Codex-8-False.png" target="_blank"><img src="paper-Codex-8-False.png" alt="柔和纸感 8% 紧凑态"></a><figcaption>8% 紧凑态</figcaption></figure></div><figure class="detail" style="background:#e7e5de"><a data-value="dynamic" data-expanded="True" href="paper-Codex-8-True.png" target="_blank"><img src="paper-Codex-8-True.png" alt="柔和纸感 详情态"></a><figcaption>详情布局 · 点击查看原图</figcaption></figure></article></main>
<footer>主题切换入口：悬浮窗右键或任务栏通知区域 → 主题。可导入独立 JSON，并导出含接口、JSON Schema、演示数据和内置参考的 AI 制作套件。这里的选择控件只切换预览图片。</footer>
<script>function update(){const provider=document.querySelector('#provider').value;const quota=document.querySelector('#quota').value;document.querySelectorAll('[data-theme]').forEach(card=>card.querySelectorAll('[data-expanded]').forEach(link=>{const value=link.dataset.value==='dynamic'?quota:link.dataset.value;const file=card.dataset.theme+'-'+provider+'-'+value+'-'+link.dataset.expanded+'.png';link.href=file;link.querySelector('img').src=file}))}document.querySelectorAll('select').forEach(el=>el.addEventListener('change',update));</script></body></html>

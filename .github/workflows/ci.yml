name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PowerShell smoke tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Smoke.ps1

      - name: Build release executable
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-Package.ps1 -SkipTests

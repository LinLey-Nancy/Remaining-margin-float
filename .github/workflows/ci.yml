name: Windows 持续集成

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 解析 PowerShell 源码
        shell: powershell
        run: |
          $parseFailures = @()
          foreach ($path in @(git ls-files '*.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$parseErrors
            )
            foreach ($parseError in @($parseErrors)) {
              $parseFailures += '{0}:{1}:{2}: {3}' -f `
                $path,
                $parseError.Extent.StartLineNumber,
                $parseError.Extent.StartColumnNumber,
                $parseError.Message
            }
          }
          if ($parseFailures.Count -gt 0) {
            throw ($parseFailures -join [Environment]::NewLine)
          }

      - name: 安装 PowerShell 静态分析器
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider `
            -Name NuGet `
            -MinimumVersion 2.8.5.201 `
            -Scope CurrentUser `
            -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Scope CurrentUser `
            -Repository PSGallery `
            -Force

      - name: 检查 PowerShell 错误级问题
        shell: powershell
        run: powershell.exe -NoProfile -File .\Test-StaticAnalysis.ps1

      - name: 运行应用诊断
        shell: powershell
        run: powershell.exe -NoProfile -File .\Test-Diagnostics.ps1

      - name: 构建透明发布目录
        shell: powershell
        run: powershell.exe -NoProfile -File .\Build-Package.ps1 -SkipArchive

      - name: 检查打包运行行为
        shell: powershell
        run: powershell.exe -NoProfile -File .\Test-Release.ps1
